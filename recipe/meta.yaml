{% set name = "wagtail-sb-admin-interface" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wagtail_sb_admin_interface-{{ version }}.tar.gz
  sha256: c6771dd4da9b35448a5ef30e35326d305a829bfdfd32fe3184d977e8315bc302

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - django >=4.2,<7.0
    - django-colorfield <1.0.0
    - wagtail >=5.2,<9.0

test:
  imports:
    - wagtail_sb_admin_interface
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.com/softbutterfly/open-source/wagtail-sb-admin-interface
  summary: Customize the Wagtail admin interface from the admin itself.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - rxm7706
